<style>
:root{--canvas:#F6F5F1;--surface:#fff;--sunken:#ECEAE4;--ink:#14212B;--ink2:#4E5D68;--line:#DFDDD6;--accent:#0B6E8F;--accentP:#095A75;--tint:#E1F0F4;--rec:#1F7A4D;--recT:#E3F2E9;--att:#9A5B00;--attT:#FCEFD3;--crit:#B3261E;--critT:#FBE8E6;--pod:#5AA7D1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--ink);background:#E2E0D8;display:flex;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* guide */
#guide{width:340px;flex:none;background:var(--ink);color:#fff;padding:24px 20px;overflow:auto;display:flex;flex-direction:column;gap:20px}
#guide h1{font-size:18px;line-height:24px}
#guide .sub{color:#A9B6BF;font-size:13px;line-height:18px}
#guide h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#A9B6BF;margin-bottom:8px;font-weight:600}
.now{background:#22323E;border-radius:16px;padding:16px}
.now .id{display:inline-block;background:var(--pod);color:var(--ink);font-weight:700;font-size:13px;border-radius:8px;padding:2px 8px;margin-bottom:8px}
.now .nm{font-weight:700;font-size:18px;line-height:24px}
.now .fl{color:#A9B6BF;font-size:13px;margin-bottom:8px}
.now p{font-size:14px;line-height:21px;color:#E3E9ED}
.nav2{display:flex;gap:8px;margin-top:12px}
.gb{background:#2F4250;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;text-align:center}
.gb:hover{background:#3B5263}.gb.on{background:#fff;color:var(--ink)}
.nav2 .gb{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fgrp{margin-bottom:12px}.fgrp .fn{font-size:13px;color:#E3E9ED;margin-bottom:6px;font-weight:600}
.chips .gb{padding:6px 9px;min-width:38px}
#gbtn,#gclose{display:none}
/* stage + phone */
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
#wrap{position:relative}
#phone{width:390px;height:844px;background:var(--canvas);border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px var(--ink),0 30px 60px rgba(20,33,43,.25);transform-origin:top left;display:flex;flex-direction:column;position:absolute;top:0;left:0}
.sb{flex:none;padding:16px 28px 4px;font-weight:600;font-size:14px}
.nv{flex:none;display:flex;align-items:center;height:48px;padding:0 8px}
.nv .bk{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:24px}
.nv .st{flex:1;text-align:center;font-size:13px;font-weight:500;color:var(--ink2);padding-right:48px}
.bd{flex:1;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.bd.c{justify-content:center;text-align:center;align-items:center;padding:24px}
.ft{flex:none;padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 26px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--ink2);min-height:48px}
.tabs button.on{color:var(--accent)}
.h1{font-size:28px;line-height:36px;font-weight:700}
.tt{font-size:24px;line-height:32px;font-weight:700}
.hd{font-size:20px;line-height:28px;font-weight:600}
.bl{font-size:18px;line-height:26px}
.sg{font-weight:600}.lb{font-size:14px;line-height:20px;font-weight:600}.cp{font-size:13px;line-height:18px;font-weight:500}
.mu{color:var(--ink2)}
.card{background:var(--surface);border-radius:24px;padding:16px;box-shadow:0 1px 2px rgba(20,33,43,.04),0 4px 16px rgba(20,33,43,.05);display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.hero{border-radius:16px;height:112px;display:flex;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.btn{min-height:56px;border-radius:32px;background:var(--accent);color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:8px 20px;text-align:center}
.btn:active{background:var(--accentP)}
.btn.big{min-height:64px;font-size:20px;box-shadow:0 2px 4px rgba(20,33,43,.06),0 8px 24px rgba(20,33,43,.12)}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.gh{background:none;color:var(--accent);min-height:48px;font-size:16px}
.btn.off{background:var(--sunken);color:var(--ink2);pointer-events:none}
.ban{border-radius:16px;padding:16px;display:flex;gap:12px;width:100%;text-align:left}
.ban .x{flex:1;display:flex;flex-direction:column;gap:4px}
.ban .a{align-self:flex-start;margin-top:8px;min-height:48px;border-radius:24px;padding:0 20px;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center}
.row{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:4px 0}
.row .l{flex:1}.row+.row{border-top:1px solid var(--line)}
.list{background:var(--surface);border-radius:24px;padding:0 16px;box-shadow:0 1px 2px rgba(20,33,43,.04),0 4px 16px rgba(20,33,43,.05);width:100%}
.seg{display:flex;gap:6px}.seg i{flex:1;height:8px;border-radius:4px;background:var(--sunken)}.seg i.on{background:var(--accent)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.choice{background:var(--surface);border-radius:24px;padding:20px;display:flex;align-items:center;gap:16px;width:100%;box-shadow:0 1px 2px rgba(20,33,43,.04),0 4px 16px rgba(20,33,43,.05);min-height:88px}
.choice .ci{width:48px;height:48px;border-radius:24px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.choice.sel{outline:2.5px solid var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sym{background:var(--surface);border-radius:20px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;font-weight:600;font-size:17px;line-height:22px;box-shadow:0 1px 2px rgba(20,33,43,.04),0 4px 16px rgba(20,33,43,.05)}
.sym .ci{width:44px;height:44px;border-radius:22px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
.sym:active{outline:2.5px solid var(--accent)}
.pill{min-height:48px;padding:0 18px;border-radius:24px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:15px;display:inline-flex;align-items:center}
.pill.on{background:var(--tint);border-color:var(--accent);color:var(--accentP)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.num{width:32px;height:32px;border-radius:16px;background:var(--tint);color:var(--accentP);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.stp{display:flex;gap:12px;align-items:flex-start;text-align:left}
.big-ic{width:96px;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--accent);width:24px}
.view{background:#101A22;border-radius:24px;height:340px;position:relative;display:flex;align-items:center;justify-content:center;width:100%}
.view{overflow:hidden}.view .fr{width:200px;height:200px;position:relative;z-index:1}
.view .fr b{position:absolute;width:36px;height:36px;border:4px solid #fff}
.view .fr b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.view .fr b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.view .fr b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.view .fr b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.view .ln{position:absolute;left:10px;right:10px;height:2px;background:var(--pod);top:20px;animation:scan 2s ease-in-out infinite alternate}
@keyframes scan{to{top:178px}}
.ecg{background:var(--surface);border-radius:16px;border:1px solid var(--line);background-image:linear-gradient(var(--sunken) 1px,transparent 1px),linear-gradient(90deg,var(--sunken) 1px,transparent 1px);background-size:20px 20px;width:100%;overflow:hidden}

.pulse{animation:pulse 1.4s ease-in-out infinite}

.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:12px;border-radius:6px;background:var(--sunken);overflow:hidden;width:100%}.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .2s linear}
.tl{display:flex;gap:12px;text-align:left}.tl .d{width:28px;height:28px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--ink2)}
.tl.done .d{background:var(--rec);color:#fff}.tl.cur .d{background:var(--accent);color:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:120px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;text-align:center;z-index:5}
.inp{height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font:inherit;font-size:18px;width:100%}
.av{width:48px;height:48px;border-radius:24px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

/* v2 polish */
body{font-family:Outfit,system-ui,-apple-system,sans-serif;letter-spacing:-.005em}

#phone{background:linear-gradient(180deg,#D9ECF4 0,#F7FAFB 44%)}
.h1{font-size:30px;line-height:38px;font-weight:500;letter-spacing:-.015em}.tt{font-weight:500;letter-spacing:-.012em}.hd{font-weight:500;font-size:19px}.sg{font-weight:500}
.lb,.chip,.pill,.btn,.tabs button,.av{font-weight:500}.sb{font-weight:500}
.card,.list,.choice{box-shadow:0 6px 20px rgba(11,110,143,.05);border:1px solid var(--line)}
.sym{background:#F2F9FB;border:1px solid #D3E6ED;box-shadow:none;font-weight:500}.sym .ci{background:#fff}.sym{min-height:128px}
.tabs{margin:0 16px 14px;border-radius:28px;border:1px solid var(--line);padding:8px 0;box-shadow:0 8px 24px rgba(20,33,43,.08)}
.tabs button{font-size:12px;gap:2px}
.ft{padding-bottom:12px}
.btn.big{min-height:60px;font-size:19px;box-shadow:0 10px 24px rgba(11,110,143,.24)}
.av{background:#fff;border:1px solid var(--line)}
canvas.wire{width:100%;display:block;touch-action:none;cursor:grab;flex:none}
.stat{display:flex;flex-direction:column;text-align:center;gap:2px}.stat .chip{justify-content:center}
.btn,.sym,.choice,.pill,.gb,.tabs button{transition:transform .16s ease,background .16s ease,border-color .16s ease,color .16s ease}
.btn:active,.sym:active,.choice:active,.pill:active{transform:scale(.975)}
.enter .bd>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.enter .bd>*:nth-child(2){animation-delay:.05s}.enter .bd>*:nth-child(3){animation-delay:.1s}.enter .bd>*:nth-child(4){animation-delay:.15s}.enter .bd>*:nth-child(5){animation-delay:.2s}.enter .bd>*:nth-child(n+6){animation-delay:.25s}
.enter .ft{animation:up .5s .2s cubic-bezier(.2,.7,.2,1) both}
.enter .grid>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}.enter .grid>*:nth-child(2){animation-delay:.04s}.enter .grid>*:nth-child(3){animation-delay:.08s}.enter .grid>*:nth-child(4){animation-delay:.12s}.enter .grid>*:nth-child(5){animation-delay:.16s}.enter .grid>*:nth-child(6){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.enter .big-ic{animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
.enter .big-ic svg{stroke-dasharray:60;stroke-dashoffset:60;animation:tick .6s .3s ease-out forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.enter .seg i.on{transform-origin:left;animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
.enter .seg i:nth-child(2){animation-delay:.08s}.enter .seg i:nth-child(3){animation-delay:.16s}.enter .seg i:nth-child(4){animation-delay:.24s}.enter .seg i:nth-child(5){animation-delay:.32s}.enter .seg i:nth-child(6){animation-delay:.4s}.enter .seg i:nth-child(7){animation-delay:.48s}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}
@media (max-width:760px){
 #guide{position:fixed;inset:0;z-index:20;width:auto;display:none}
 #guide.open{display:flex}
 #gclose{display:block;align-self:flex-end}
 #gbtn{display:block;position:fixed;top:10px;right:10px;z-index:10;background:var(--ink);color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600}
 #stage{align-items:stretch}#wrap{width:100%!important;height:100dvh!important}
 #phone{width:100%;height:100dvh;border-radius:0;box-shadow:none;transform:none!important;position:static}
}

const hdr=(back,step)=>`<div class="sb">9:41</div>`+(back||step?`<div class="nv">${back?`<button class="bk" data-go="${back}" aria-label="Back">${ic('back')}</button>`:'<span style="width:48px"></span>'}<span class="st">${step||''}</span></div>`:'');
const tabs=on=>`<nav class="tabs">${[['T1','Today','home'],['T2','Diary','book'],['T3','Help','help']].map(([g,n,i])=>`<button data-go="${g}" class="${on===g?'on':''}">${ic(i)}${n}</button>`).join('')}</nav>`;
const btn=(t,go,cls='',act='')=>`<button class="btn ${cls}" ${go?`data-go="${go}"`:''} ${act?`data-do="${act}"`:''}>${t}</button>`;
const seg=d=>`<div class="seg">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=d?'on':''}"></i>`).join('')}</div>`;
const row=(i,l,v,go)=>`<${go?'button':'div'} class="row" ${go?`data-go="${go}"`:''}>${i?ic(i,24,'var(--ink2)'):''}<span class="l">${l}</span><span class="sg">${v||''}</span>${go?ic('chev',20,'var(--ink2)'):''}</${go?'button':'div'}>`;
const statusCard=(k,i,chip,h,sub)=>`<div class="stat">${patch(k,S.issue&&!S.done?138:172,0,S.issue==='range'&&!S.done?'far':'')}<div class="chip" style="color:${K[k][0]}">${ic(i,20)}${chip}</div><div class="tt">${h}</div><div class="mu">${sub}</div></div>`;
const done=(k,i,h,p)=>`<div class="big-ic" style="background:${K[k][1]};color:${K[k][0]}">${ic(i,48)}</div><div class="tt">${h}</div><p class="bl mu">${p}</p>`;
const sv=h=>`<svg class="il" width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#0B6E8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${h}</svg>`,TI='fill="#D9ECF3"';
const SV={palp:sv(`<path ${TI} d="M24 41 10.5 27.5a9.4 9.4 0 1 1 13.5-13 9.4 9.4 0 1 1 13.5 13z"/><path d="M7 27h8l3-7 4.5 13 4-9 2 3h12.5" stroke="#14212B"/><path d="M5 12q-2.5 4 0 8M43 12q2.5 4 0 8" stroke-width="1.6"/>`),
dizzy:sv(`<circle ${TI} cx="24" cy="30" r="12"/><path d="M18.5 27l3 3m0-3-3 3M26.5 27l3 3m0-3-3 3" stroke="#14212B" stroke-width="1.8"/><path d="M20.5 36q3.5-2.5 7 0" stroke="#14212B" stroke-width="1.8"/><ellipse cx="24" cy="12" rx="15" ry="5" stroke-dasharray="3 4"/><path d="M9 9.5l.9 2 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2L6 11.800l2-.3zM38 5l.8 1.700 1.800.3-1.300 1.200.3 1.800L38 9.100l-1.600.9.3-1.800-1.300-1.200 1.800-.3z" fill="#0B6E8F" stroke="none"/>`),
chest:sv(`<circle ${TI} cx="24" cy="9" r="5.500"/><path ${TI} d="M9 44V30c0-7 6-11 15-11s15 4 15 11v14"/><path d="M17 44V34M31 44V34" stroke-width="1.600"/><circle cx="28" cy="29" r="2.600" fill="#14212B" stroke="none"/><path d="M28 22.500v2M28 33.500v2M21.500 29h2M32.500 29h2M23.400 24.400l1.400 1.400M31.200 32.200l1.400 1.400M32.600 24.400l-1.400 1.400M24.800 32.200l-1.400 1.400" stroke="#14212B" stroke-width="1.800"/>`),
breath:sv(`<path d="M24 6v15M24 21l-5 4M24 21l5 4"/><path ${TI} d="M19 14c-7 2-12 11-12 21 0 5 3.500 6.500 7 5.500s5-3.500 5-7.500z"/><path ${TI} d="M29 14c7 2 12 11 12 21 0 5-3.500 6.500-7 5.500s-5-3.500-5-7.500z"/><path d="M12 30q3 1 4 4M36 30q-3 1-4 4" stroke-width="1.600"/><path d="M20 3q4-2 8 0" stroke="#14212B" stroke-width="1.600"/>`),
faint:sv(`<path d="M5 41h38" stroke="#14212B"/><circle ${TI} cx="11" cy="33" r="4.500"/><path ${TI} d="M16 31.500h13l4 1.500 8 4.500-1.500 2.500H17z"/><path d="M22 31.500l-2-6" /><path d="M24 6v10M20 12.500l4 4 4-4M33 9v7M15 9v7" stroke-width="1.800"/>`),
other:sv(`<rect ${TI} x="9" y="6" width="26" height="34" rx="5"/><path d="M15 15h14M15 22h14M15 29h7"/><circle cx="35" cy="36" r="8" fill="#0B6E8F" stroke="#fff"/><path d="M35 32.500v7M31.500 36h7" stroke="#fff"/>`)};
const SYM=[['Palpitations','palp'],['Dizziness','dizzy'],['Chest discomfort','chest'],['Breathless','breath'],['Fainted','faint'],['Something else','other']];
const today=()=>{const is=S.issue&&ISS[S.issue];let h=`<div class="sb">9:41</div><div class="bd"><div class="sp"><div><div class="cp mu">${S.done?'Thursday 19 November':'Sunday 15 November'}</div><div class="tt">Hello, Lakshmi</div></div><button class="av" data-go="T4" aria-label="Profile and settings">LR</button></div>`;
 if(S.done)h+=statusCard('acc','check','Complete','Monitoring complete','All 7 days are recorded. Thank you, Lakshmi.');
 else if(is)h+=statusCard(is.k,is.ic,is.chip,is.h,is.sub)+`<div class="ban" style="background:${K[is.k][1]}">${ic(is.ic,24,K[is.k][0])}<div class="x"><div class="sg">${is.bt}</div><div class="mu">${is.bb}</div><button class="a" style="background:${K[is.k][0]}" data-go="${is.direct||'D2'}">${is.ba}</button></div></div>`;
 else h+=statusCard('rec','check','Recording','Your patch is working well','Last synced 2 min ago');
 h+=`<div class="card"><div class="sp"><span class="hd">Day ${S.done?7:3} of 7</span><span class="mu">${S.done?'Ended today':'Ends Thu 19 Nov'}</span></div>${seg(S.done?7:3)}${S.done?'<div class="mu">Dr. Rao will receive your report by Fri 20 Nov.</div>':is?'':'<div class="mu">Next: a technician reviews your recording after Day 7. Dr. Rao gets the report within 24 hours.</div>'}</div>`;
 if(S.done)h+=`<div class="list">${row('','Days recorded','7 of 7')}${row('','Symptoms logged',S.diary.length)}</div>`;
 else if(!is)h+=`<div class="list">${row('signal','Signal','Good')}${row('battery','Patch battery','Good · 82%')}</div>`;
 return h+`</div><div class="ft">${S.done?btn('See what happens next','E1','big'):btn(ic('plus')+'Log a symptom','C1','big')}</div>`+tabs('T1');};
const SC={
A1:{n:'Get started',f:'A · Nurse setup',why:'Replaces the old QR SCAN / REGISTER / LOGIN buttons with two plain choices, so nobody has to guess which path is theirs.',r:()=>hdr()+`<div class="bd" style="justify-content:center;gap:16px"><div style="text-align:center;padding:8px 0 16px">${patch('rec',190)}<div class="h1" style="margin-top:16px">Welcome to upBeat</div><p class="bl mu">Heart monitoring at home, prescribed by your doctor.</p></div><button class="choice" data-go="A2"><span class="ci">${ic('nurse')}</span><span style="flex:1"><span class="hd" style="display:block">I’m setting up a patient</span><span class="mu">For nurses and clinic staff</span></span>${ic('chev',20,'var(--ink2)')}</button><button class="choice" data-go="B1"><span class="ci">${ic('user')}</span><span style="flex:1"><span class="hd" style="display:block">I’m the patient</span><span class="mu">My patch is already on</span></span>${ic('chev',20,'var(--ink2)')}</button></div><div class="ft">${btn(ic('globe',20)+'English · हिन्दी · తెలుగు','','gh','toast:Language picker opens here')}<div style="text-align:center;font-size:11px;color:var(--ink2);margin-top:6px">© 2026 Kiran Poojary · Concept prototype</div></div>`},
A2:{n:'Scan kit QR',f:'A · Nurse setup',why:'Scanning the box links the patient, the prescription and the device in one step, so the nurse types nothing. It uses the phone camera and reads any QR code. If the camera is blocked, tap the viewfinder to simulate a scan.',r:()=>hdr('A1','Setup · 1 of 6')+`<div class="bd"><div class="tt">Scan the code on the upBeat box</div><p class="mu">Hold the phone over the QR code on the side of the kit.</p>${S.manual?`<input class="inp" value="UB-2291-7K4" aria-label="Kit code"><p class="cp mu">The code is printed under the QR code.</p>`:`<button class="view" id="camview" data-go="A3" aria-label="Scan the kit QR code"><video id="cam" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px;display:none"></video><span class="fr"><b></b><b></b><b></b><b></b><span class="ln"></span></span><span id="camnote" class="cp" style="position:absolute;bottom:14px;left:16px;right:16px;color:#fff;text-align:center">Starting camera…</span></button>`}</div><div class="ft">${S.manual?btn('Continue','A3'):''}${btn(S.manual?'Scan the code instead':'Enter the code by hand','','gh','manual')}</div>`},
A3:{n:'Confirm patient',f:'A · Nurse setup',why:'A deliberate check before recording starts: the wrong patient on a device is the most expensive setup error.',r:()=>hdr('A2','Setup · 2 of 6')+`<div class="bd"><div class="tt">Is this the right patient?</div><div class="list">${row('','Patient','Lakshmi Rao, 62')}${row('','Prescribed by','Dr. A. Rao')}${row('','Monitoring','7 days')}${row('','Starts','Today, Fri 13 Nov')}${row('','Ends','Thu 19 Nov')}${row('','Device','UB-2291')}</div></div><div class="ft">${btn('Yes, continue','A4')}${btn('Something is wrong','','sec','toast:Opens edit or call-the-clinic options')}</div>`},
A4:{n:'Apply patch',f:'A · Nurse setup',why:'One instruction per screen with a picture. Good skin contact at fitting is what prevents the patch coming loose, the main reason monitoring ends early.',r:()=>{const st=[['Clean and dry the skin','Wipe the upper left chest and let it dry fully. Shave the area if needed.',torso(false)],['Place the patch on the chest','Angle it as shown, just above the rib cage. It works the same for men and women.',torso()],['Press firmly for 30 seconds','Press along the whole patch so every edge sticks.',torso()]][S.a4];return hdr(S.a4?'':'A3','Setup · 3 of 6')+`<div class="bd"><div class="dots">${[0,1,2].map(i=>`<i class="${i===S.a4?'on':''}"></i>`).join('')}</div><div class="hero" style="background:var(--surface);height:220px;border:1px solid var(--line)">${st[2]}</div><div class="tag">Step ${S.a4+1} of 3</div><div class="tt">${st[0]}</div><p class="bl mu">${st[1]}</p></div><div class="ft">${S.a4<2?btn('Next','','','a4'):btn('Patch is on','A5')}${S.a4?btn('Back','','gh','a4b'):''}</div>`}},
A5:{n:'Connect device',f:'A · Nurse setup',why:'Pairing happens by itself once the device clicks in. The only motion in the app is here and in syncing, where it explains what is happening.',r:()=>hdr('A4','Setup · 4 of 6')+`<div class="bd c">${S.found?patch('rec',220,0)+'<div class="tt">Connected to UB-2291</div><p class="bl mu">The light on the device is green.</p>':`${patch('off',220,1)}<div class="tt">Snap the device into the patch</div><p class="bl mu">Push until it clicks. We’ll find it automatically.</p><div class="chip mu">${ic('sync',20,'currentColor','spin')}Looking for the device…</div>`}</div><div class="ft">${S.found?btn('Check the signal','A6'):btn('Not finding it?','','gh','toast:Tips: Bluetooth on, phone within 1 m, device fully clicked in')}</div>`},
A6:{n:'Signal check',f:'A · Nurse setup',why:'The only place a live ECG trace appears, and only for the nurse: it proves contact before the patient leaves. Use Simulate → Poor signal to see the other state.',r:()=>{const bad=S.issue==='signal';return hdr('A5','Setup · 5 of 6')+`<div class="bd"><div class="tt">${bad?'The signal is weak':'The signal looks good'}</div><div class="sp"><span class="tag">Live trace · nurse view</span><span class="chip" style="color:${bad?'var(--att)':'var(--rec)'}">${ic(bad?'alert':'check',20)}${bad?'Poor contact':'Good contact'}</span></div>${ecg(bad)}${bad?`<div class="ban" style="background:var(--attT)">${ic('alert',24,'var(--att)')}<div class="x"><div class="sg">Press the patch down again</div><div class="mu">Hold for 30 seconds. If it stays weak, move it slightly and try once more.</div></div></div>`:`<div class="list">${row('signal','Contact','Good')}${row('battery','Device battery','Full')}</div>`}</div><div class="ft">${bad?btn('Check again','','','clear'):btn('Start recording','A7')}</div>`}},
A7:{n:'Hand over',f:'A · Nurse setup',why:'The nurse sets the patient’s language before handing over, so the first screen the patient reads is in their own language.',r:()=>hdr('A6','Setup · 6 of 6')+`<div class="bd"><div class="chip" style="color:var(--rec)">${ic('check',20)}Recording started at ${now()}</div><div class="tt">Which language does Lakshmi read?</div>${['English','हिन्दी','తెలుగు'].map(l=>`<button class="choice ${S.lang===l?'sel':''}" data-do="lang:${l}" style="min-height:64px;padding:12px 20px"><span class="hd" style="flex:1">${l}</span>${S.lang===l?ic('check',24,'var(--accent)'):''}</button>`).join('')}</div><div class="ft">${btn('Hand the phone to the patient','B1')}</div>`},
B1:{n:'Welcome',f:'B · Patient first run',why:'Opens with the doctor’s name and the end date instead of marketing copy: the patient already has the device and wants to know what is being asked of them.',r:()=>hdr()+`<div class="bd c">${patch('rec',190)}<div class="h1" style="margin-top:16px">Hello, Lakshmi</div><p class="bl mu">Dr. Rao has asked you to wear upBeat for 7 days. It records your heartbeat so your doctor can see what happens in daily life.</p><div class="pill" style="pointer-events:none">Ends Thursday 19 November</div></div><div class="ft">${btn('Continue','B2')}</div>`},
B2:{n:'Three things to know',f:'B · Patient first run',why:'Only the three behaviours that affect data quality. Everything else lives in Help, so first run stays under a minute.',r:()=>{const c=[['phone','Keep your phone close','Stay within about 10 metres. A pocket or bedside table is fine.'],['heart','Tell us when you feel something','Tap Log a symptom the moment you notice it. This is the most helpful thing you can do.'],['drop','Live normally','You can shower, sleep and exercise with the patch on.']][S.b2];return hdr(S.b2?'':'B1')+`<div class="bd c"><div class="big-ic" style="background:var(--tint);color:var(--accent)">${ic(c[0],48)}</div><div class="tag">${S.b2+1} of 3</div><div class="tt">${c[1]}</div><p class="bl mu">${c[2]}</p><div class="dots" style="margin-top:8px">${[0,1,2].map(i=>`<i class="${i===S.b2?'on':''}"></i>`).join('')}</div></div><div class="ft">${S.b2<2?btn('Next','','','b2'):btn('Continue','B3')}${S.b2<2?btn('Skip','B3','gh'):''}</div>`}},
B3:{n:'Permissions',f:'B · Patient first run',why:'Each permission is asked with its reason in plain words, because silent background or Bluetooth restrictions are how recordings get lost.',r:()=>hdr('B2')+`<div class="bd"><div class="tt">Three things your phone will ask</div><p class="mu">upBeat needs these to keep recording all week.</p>${[['b','bt','Bluetooth','So the patch can talk to your phone.'],['n','bell','Notifications','So we can tell you if recording stops.'],['g','sync','Keep running','So recording continues when the app is closed.']].map(([k,i,t,d])=>`<div class="card" style="flex-direction:row;align-items:center"><span class="num" style="width:44px;height:44px;border-radius:22px">${ic(i)}</span><span style="flex:1"><span class="sg" style="display:block">${t}</span><span class="mu cp">${d}</span></span>${S.perm[k]?`<span class="chip" style="color:var(--rec)">${ic('check',20)}On</span>`:`<button class="pill on" data-do="perm:${k}">Allow</button>`}</div>`).join('')}</div><div class="ft">${btn('Continue','B4',S.perm.b&&S.perm.n&&S.perm.g?'':'off')}</div>`},
B4:{n:'If you feel very unwell',f:'B · Patient first run',why:'The old app showed a grey hazard triangle before setup. The same honest message now arrives calmly, with something real to do.',r:()=>hdr('B3')+`<div class="bd c"><div class="big-ic" style="background:var(--tint);color:var(--accent)">${ic('info',48)}</div><div class="tt">upBeat records. It does not call for help.</div><p class="bl mu">Nobody is watching your heartbeat live. If you feel very unwell, call 108 or your doctor straight away. Don’t wait for the app.</p></div><div class="ft">${btn('I understand','T1')}</div>`},
T1:{n:'Today',f:'Home',why:'Answers “is it working?” first. Use the Simulate buttons to switch between recording well, problems and Day 7.',r:today},
T2:{n:'Diary',f:'Home',why:'A plain list of what the patient logged, so they can check and correct it. No heart data is shown here.',r:()=>{const g={};S.diary.forEach(e=>(g[e.d]=g[e.d]||[]).push(e));return `<div class="sb">9:41</div><div class="bd"><div class="tt">Diary</div>${S.diary.length?Object.keys(g).map(d=>`<div class="tag" style="margin-top:8px">${d}</div><div class="list">${g[d].map(e=>`<div class="row"><span class="l"><span class="sg" style="display:block">${e.s}</span><span class="mu cp">${e.a||'No details added'}</span></span><span class="mu">${e.t}</span></div>`).join('')}</div>`).join(''):'<p class="bl mu" style="margin-top:24px">Nothing logged yet. When you feel something, tap the button below.</p>'}</div><div class="ft">${S.done?'':btn(ic('plus')+'Log a symptom','C1','big')}</div>`+tabs('T2')}},
T3:{n:'Help',f:'Home',why:'Everything that is not a daily action lives here, with support and emergency guidance one tap away.',r:()=>{const it=(k,i,t,body,go)=>`<button class="row" ${k==='loose'?'data-do="fix:signal"':go?`data-go="${go}"`:`data-do="help:${k}"`}>${ic(i,24,'var(--ink2)')}<span class="l sg">${t}</span>${ic('chev',20,'var(--ink2)')}</button>${S.help===k&&body?`<div class="mu" style="padding:0 0 16px 36px">${body}</div>`:''}`;return `<div class="sb">9:41</div><div class="bd"><div class="tt">Help</div><div class="list">${it('care','drop','Living with the patch','Showers are fine. Pat the patch dry afterwards. Avoid creams or oil near it. Sleep and exercise as usual.')}${it('loose','alert','My patch came loose','','D2')}${it('faq','help','Common questions','<b>Can I see my heartbeat?</b> No. Your doctor reviews it with a specialist after Day 7.<br><br><b>What if I leave my phone at home?</b> Come back within range and the app will reconnect.')}</div><div class="list">${it('call','call','Call support','','D4')}${it('emg','info','If you feel very unwell','','B4')}</div></div>`+tabs('T3')}},
T4:{n:'Profile and settings',f:'Home',why:'Rarely needed, so it sits behind the avatar instead of taking a tab.',r:()=>hdr('T1','Profile and settings')+`<div class="bd"><div class="list">${row('user','Name','Lakshmi Rao')}${row('nurse','Doctor','Dr. A. Rao')}${row('box','Device','UB-2291')}</div><div class="list">${row('globe','Language',S.lang)}${row('bell','Notifications','On')}${row('doc','Privacy and terms','')}</div></div>`},
C1:{n:'Log symptom',f:'C · Log a symptom',why:'The time is captured the instant this opens, because the timestamp is what the doctor matches to the ECG. One tap on a symptom finishes the log.',r:()=>{const o=S.pend.off;return hdr('T1')+`<div class="bd"><div class="tt">What did you feel?</div><p class="mu">Tap what you felt. Nothing is saved until you choose.</p><div class="sg">When did it happen?</div><div class="pills">${[[0,'Now · '+S.pend.t],[5,'5 min ago'],[15,'15 min ago'],[60,'1 hour ago']].map(([m,l])=>`<button class="pill ${o===m?'on':''}" data-do="off:${m}">${l}</button>`).join('')}</div><div class="grid">${SYM.map(([s,i])=>`<button class="sym" data-do="sym:${s}">${SV[i]}${s}</button>`).join('')}</div></div>`}},
C2:{n:'Add details',f:'C · Log a symptom',why:'Optional context for the doctor. Skipping it never blocks the log. For \u201cSomething else\u201d it opens first, so the patient can say what they felt before anything is saved.',r:()=>{const o=S.pend&&S.pend.other;return hdr(o?'C1':'C3')+`<div class="bd"><div class="tt">${o?'Tell us what you felt':'A little more, if you can'}</div>${o?`<textarea id="note" class="inp" rows="3" style="height:auto;padding:14px 16px;resize:none" placeholder="For example: tingling in my left arm" aria-label="Describe what you felt">${(S.pend.note||'').replace(/</g,'&lt;')}</textarea><p class="cp mu">A few words are enough. You can also leave it blank.</p>`:''}<div class="sg">What were you doing?</div><div class="pills">${['Resting','Walking','Exercise','Sleeping'].map(a=>`<button class="pill ${S.pend.a===a?'on':''}" data-do="act:${a}">${a}</button>`).join('')}</div><div class="sg" style="margin-top:8px">How strong was it?</div><div class="pills">${['Mild','Moderate','Strong'].map(a=>`<button class="pill ${S.pend.v===a?'on':''}" data-do="sev:${a}">${a}</button>`).join('')}</div></div><div class="ft">${o?btn('Save','','','saveOther'):btn('Save details','C3')}</div>`}},
C3:{n:'Logged',f:'C · Log a symptom',why:'Confirms the log and tells the patient why it matters. In the real app this closes by itself after a few seconds.',r:()=>hdr()+`<div class="bd c">${done('rec','check',(S.pend?S.pend.s:'Symptom')+' logged','Saved at '+(S.pend?S.pend.t:now())+'. Your doctor will see this next to your heart recording.')}${S.pend&&(S.pend.a||S.pend.v)?`<div class="pill" style="pointer-events:none">${[S.pend.a,S.pend.v].filter(Boolean).join(' · ')}</div>`:''}</div><div class="ft">${btn('Done','T1')}${btn(S.pend&&(S.pend.a||S.pend.v)?'Change details':'Add details','C2','sec')}</div>`},
D1:{n:'Issue banner',f:'D · Fix a problem',why:'A problem appears on Today as one line and one button. Amber means still recording; red means not connected.',r:today},
D2:{n:'Guided fix',f:'D · Fix a problem',why:'Steps specific to the problem, then the app checks for itself so the patient is never left wondering.',r:()=>{const is=ISS[S.issue]||ISS.range;return hdr('T1')+`<div class="bd">${is===ISS.range?patch('crit',150,0,'loop'):''}<div class="tt">${is.title}</div>${is.steps.map((s,i)=>`<div class="stp"><span class="num">${i+1}</span><span class="bl" style="flex:1">${s}</span></div>`).join('')}<div class="ban" style="background:var(--tint)">${ic('info',24,'var(--accent)')}<div class="x"><div class="mu">${is.tip}</div></div></div></div><div class="ft">${S.chk?`<div class="btn off">${ic('sync',20,'currentColor','spin')}Checking…</div>`:btn('I’ve done this. Check now','','','check')}${btn('It’s still not working','D4','gh')}</div>`}},
D3:{n:'Fixed',f:'D · Fix a problem',why:'Closes the loop with the same green state the patient saw before the problem.',r:()=>hdr()+`<div class="bd c">${done('rec','check','Recording again','Everything is working. Thank you for fixing that.')}</div><div class="ft">${btn('Back to Today','T1')}</div>`},
D4:{n:'Still not working',f:'D · Fix a problem',why:'A human is the fallback after about two minutes of trying. The device ID is shown so the patient doesn’t have to find it.',r:()=>hdr('T1')+`<div class="bd"><div class="tt">Let’s get you some help</div><p class="bl mu">Our support team can sort this out on a call.</p><div class="list">${row('box','Your device','UB-2291')}${row('call','Support line','1800 000 0000')}</div><p class="cp mu">Placeholder number. Have your device ID ready when you call.</p></div><div class="ft">${btn(ic('call')+'Call support','','','toast:Opens the phone dialler')}${btn('Try the steps again','D2','sec')}</div>`},
E1:{n:'Monitoring complete',f:'E · Finish',why:'A clear ending with what was achieved, before asking the patient to do anything else.',r:()=>hdr('T1')+`<div class="bd c">${done('acc','check','You’re done, Lakshmi','Seven days recorded. Three short steps are left.')}<div class="list">${row('','Days recorded','7 of 7')}${row('','Symptoms logged',S.diary.length)}</div></div><div class="ft">${btn('Remove the patch','E2')}</div>`},
E2:{n:'Remove the patch',f:'E · Finish',why:'Removal is where skin irritation happens, so it gets its own picture and a reassurance.',r:()=>hdr('E1','Finish · 1 of 3')+`<div class="bd"><div class="hero" style="background:var(--surface);height:200px;border:1px solid var(--line)">${torso()}</div><div class="tt">Peel the patch off slowly</div><div class="stp"><span class="num">1</span><span class="bl" style="flex:1">Lift one edge and peel gently along the skin.</span></div><div class="stp"><span class="num">2</span><span class="bl" style="flex:1">Wash the area with soap and water.</span></div><p class="mu">A little redness is normal and fades in a day or two.</p></div><div class="ft">${btn('Patch is off','E3')}</div>`},
E3:{n:'Final upload',f:'E · Finish',why:'The patient must not walk away with data still on the phone, so the app waits and says clearly when everything is safe.',r:()=>hdr('','Finish · 2 of 3')+`<div class="bd c">${S.up>=100?done('rec','check','All your data is safe','Everything has been uploaded.'):`<div class="big-ic" style="background:var(--tint);color:var(--accent)">${ic('sync',48,'currentColor','spin')}</div><div class="tt">Sending the last of your recording</div><p class="bl mu">Keep the device next to your phone.</p>`}<div class="bar"><i id="upb" style="width:${S.up}%"></i></div><div class="mu" id="upt">${Math.round(S.up)}%</div></div><div class="ft">${btn('Continue','E4',S.up>=100?'':'off')}</div>`},
E4:{n:'Return device',f:'E · Finish',why:'Shown only if the device is reused. Whether it is returned or thrown away is an open question for Monitra.',r:()=>hdr('E3','Finish · 3 of 3')+`<div class="bd c"><div class="big-ic" style="background:var(--tint);color:var(--accent)">${ic('box',48)}</div><div class="tt">Bring the device back to your clinic</div><p class="bl mu">Pop it out of the patch and put it in its box. The used patch can go in the bin.</p></div><div class="ft">${btn('Done','E5')}</div>`},
E5:{n:'Report status',f:'E · Finish',why:'Tells the patient who is looking at their data and when, which is what patients say they are missing. Use Simulate → Report ready to see the final state.',r:()=>hdr('T1')+`<div class="bd"><div class="tt">${S.ready?'Your report is with Dr. Rao':'What happens now'}</div><div class="card" style="gap:20px"><div class="tl done"><span class="d">${ic('check',16)}</span><span><span class="sg" style="display:block">Recording complete</span><span class="mu cp">Thu 19 Nov</span></span></div><div class="tl ${S.ready?'done':'cur'}"><span class="d">${ic(S.ready?'check':'sync',16)}</span><span><span class="sg" style="display:block">A heart specialist’s team reviews it</span><span class="mu cp">${S.ready?'Finished Fri 20 Nov':'In progress'}</span></span></div><div class="tl ${S.ready?'done':''}"><span class="d">${ic(S.ready?'check':'doc',16)}</span><span><span class="sg" style="display:block">Report goes to Dr. Rao</span><span class="mu cp">${S.ready?'Sent Fri 20 Nov':'Expected by Fri 20 Nov'}</span></span></div></div><p class="mu">${S.ready?'Dr. Rao will talk you through the results at your next appointment.':'We’ll send you a notification when your doctor has it.'}</p></div><div class="ft">${btn('Back to Today','T1','sec')}</div>`}};
const ORDER=Object.keys(SC),FLOWS=[['A · Nurse setup','A'],['B · Patient first run','B'],['Home tabs','T'],['C · Log a symptom','C'],['D · Fix a problem','D'],['E · Finish','E']];
const A={guide(){G.classList.toggle('open')},toast(m){S.toast=m;timers.push(setTimeout(()=>{S.toast='';render()},2200))},manual(){S.manual=!S.manual},a4(){S.a4++},a4b(){S.a4--},b2(){S.b2++},lang(l){S.lang=l},perm(k){S.perm[k]=true},help(k){S.help=S.help===k?null:k},clear(){S.issue=null},fix(k){go('D2');S.issue=k;render()},
 off(m){S.pend.off=+m},sym(s){if(s==='Something else'){S.pend.s=s;S.pend.other=true;return go('C2')}S.pend.s=s;const t=S.pend.off?new Date(Date.now()-S.pend.off*6e4).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):S.pend.t;S.pend.t=t;S.pend.e={d:'Today · Sun 15 Nov',t,s,a:''};S.diary.unshift(S.pend.e);go('C3')},
 saveOther(){const p=S.pend,t=p.off?new Date(Date.now()-p.off*6e4).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):p.t;p.t=t;p.s=(p.note||'').trim()||'Something else';p.e={d:'Today · Sun 15 Nov',t,s:p.s,a:[p.a,p.v].filter(Boolean).join(' · ')};S.diary.unshift(p.e);p.other=false;go('C3')},act(a){S.pend.a=a;det()},sev(v){S.pend.v=v;det()},check(){S.chk=true;render();timers.push(setTimeout(()=>{S.chk=false;S.issue=null;go('D3')},1600))},
 sim(v){if(v==='ready'){S.done=true;S.ready=true;return go('E5')}S.ready=false;S.done=v==='done';S.issue=['ok','done'].includes(v)?null:v;go(S.cur==='A6'&&(v==='ok'||v==='signal')?'A6':'T1')},
 jump(id){go(id)},step(d){const i=ORDER.indexOf(S.cur)+ +d;if(ORDER[i])go(ORDER[i])},restart(){S=fresh();go('A1')}};
const det=()=>{if(S.pend&&S.pend.e)S.pend.e.a=[S.pend.a,S.pend.v].filter(Boolean).join(' · ')};
function go(id){stopCam();timers.forEach(clearTimeout);timers=[];S.toast='';S.chk=false;const f=id[0];
 if(f==='D'&&id!=='D3'&&id!=='D4'&&!S.issue)S.issue='range';
 if(f==='E'){S.done=true;S.issue=null}
 if(id==='A4'&&S.cur!=='A4')S.a4=0;if(id==='B2'&&S.cur!=='B2')S.b2=0;
 if(id==='C1')S.pend={t:now(),off:0};
 if(id==='A5'){S.found=false;timers.push(setTimeout(()=>{S.found=true;render()},2000))}
 if(id==='E3'){S.up=0;const tick=()=>{S.up=Math.min(100,S.up+4);const b=document.getElementById('upb'),t=document.getElementById('upt');if(S.up>=100)render();else{if(b)b.style.width=S.up+'%';if(t)t.textContent=S.up+'%';timers.push(setTimeout(tick,120))}};timers.push(setTimeout(tick,300))}
 liftCur=id==='A5'?1:0;anim=true;S.cur=id;render();}

/* 3D wireframe patch */
const HEX={rec:[31,122,77],att:[154,91,0],crit:[179,38,30],acc:[11,110,143],off:[154,167,175]};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const stad=(a,r,n=16)=>{const p=[];for(let i=0;i<=n;i++){const t=-Math.PI/2+Math.PI*i/n;p.push([a+r*Math.cos(t),r*Math.sin(t)])}for(let i=0;i<=n;i++){const t=Math.PI/2+Math.PI*i/n;p.push([-a+r*Math.cos(t),r*Math.sin(t)])}p.push(p[0]);return p};
const circ=(cx,r,n=30)=>Array.from({length:n+1},(_,i)=>[cx+r*Math.cos(2*Math.PI*i/n),r*Math.sin(2*Math.PI*i/n)]);
const L3=(pts,z)=>pts.map(([x,y])=>[x,y,z]);
const dogbone=()=>{const a=100,R=42,w=19,f=24,xc=a-Math.sqrt((R+f)**2-(w+f)**2),ph=Math.atan2(w+f,xc-a),fa=Math.atan2(-(w+f),a-xc),h=[];
 h.push([0,w],[xc,w]);for(let i=1;i<=8;i++){const t=-Math.PI/2+(fa+Math.PI/2)*i/8;h.push([xc+f*Math.cos(t),w+f+f*Math.sin(t)])}
 for(let i=1;i<=40;i++){const t=ph-2*ph*i/40;h.push([a+R*Math.cos(t),R*Math.sin(t)])}
 for(let i=1;i<=8;i++){const t=-fa+(Math.PI/2+fa)*i/8;h.push([xc+f*Math.cos(t),-(w+f)+f*Math.sin(t)])}h.push([0,-w]);
 return h.concat(h.slice(1,-1).reverse().map(([x,y])=>[-x,y]),[h[0]]);};
const DB=dogbone();
/* layers: [points, z, fill alpha, isPod] painted bottom to top */
const BASE=[[DB,0,0],[DB,2.5,.72],[circ(-100,27),2.6,0],[circ(100,27),2.6,0],[circ(-100,16),2.6,0],[circ(100,16),2.6,0],
 [stad(20,33),2.6,.6],[stad(20,33),9,.85],[stad(17,29),9,0]];
const POD=[[stad(20,28),9,.55],[stad(20,28),20,.75],[stad(19.5,26.5),25,.85],[stad(19,24.5),28,.95]];
const POD_TOP=stad(17,20.5);
let T0=performance.now(),drag={x:0,y:0,on:false,px:0,py:0},liftCur=0,raf=0;
function frame(now){raf=0;const cs=document.querySelectorAll('canvas.wire');if(!cs.length)return;const t=RM?0:(now-T0)/1000;
 if(!drag.on){drag.x*=.94;drag.y*=.94}
 cs.forEach(c=>{const w=c.clientWidth,h=c.clientHeight,d=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(w*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
  const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
  const scn=c.dataset.scene;let u=1;if(scn){const ph=RM?.9:(t%5.5)/5.5;u=scn==='far'?0:ph<.22?0:ph<.6?(1-Math.cos((ph-.22)/.38*Math.PI))/2:1}const k=scn?(u>.97?'rec':'crit'):c.dataset.k,col=HEX[k]||HEX.acc;liftCur+=((+c.dataset.lift||0)-liftCur)*.07;
  const yaw=-.5+.32*Math.sin(t*.55)+drag.x,tl=1.02+.07*Math.sin(t*.8)+drag.y,bob=RM?0:3*Math.sin(t*1.3);
  const cy=Math.cos(yaw),sy=Math.sin(yaw),ct=Math.cos(tl),st=Math.sin(tl),sc=Math.min(w/310,h/150)*(scn?.72:1),cx0=w/2-(scn?w*.19:0),cy0=h/2+6;
  const pr=(p,dz)=>{const z=p[2]+dz,X=p[0]*cy-p[1]*sy,Y=p[0]*sy+p[1]*cy,dp=Y*st+z*ct,f=760/(760+dp);return [cx0+X*f*sc,cy0+(Y*ct-z*st)*f*sc+bob,dp,f]};
  const halo=(r,a)=>{x.beginPath();x.arc(cx0,cy0,r,0,7);x.fillStyle=`rgba(${col},${a})`;x.fill()};
  
  const lz=liftCur*(46+(RM?0:5*Math.sin(t*2)));
  const draw=(ls,dz)=>ls.forEach(l=>{let m=0;x.beginPath();l.forEach((p,i)=>{const q=pr(p,dz);m+=q[2];i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.strokeStyle=`rgba(11,90,117,${Math.max(.22,Math.min(.95,.62-m/l.length/150))})`;x.lineWidth=1.2;x.lineJoin='round';x.stroke()});
  const loop=(pts,z,dz,fa,stroke,blue)=>{x.beginPath();let m=0;pts.forEach((p,i)=>{const q=pr([p[0],p[1],z],dz);m+=q[2];i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.closePath();
   if(blue){x.fillStyle='rgba(90,167,209,.92)';x.fill();x.strokeStyle='rgba(11,90,117,.55)'}else{if(fa){x.fillStyle=`rgba(255,255,255,${fa})`;x.fill()}x.strokeStyle=stroke||`rgba(11,90,117,${Math.max(.3,Math.min(.9,.6-m/pts.length/160))})`}
   x.lineWidth=1.15;x.lineJoin='round';x.stroke()};
  const ribs=(a,b,dz,n)=>{x.beginPath();for(let i=0;i<a[0].length-1;i+=n){const p=pr([a[0][i][0],a[0][i][1],a[1]],dz),q=pr([b[0][i][0],b[0][i][1],b[1]],dz);x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1])}x.strokeStyle='rgba(11,90,117,.28)';x.lineWidth=1;x.stroke()};
  BASE.forEach(([p,z,fa])=>loop(p,z,0,fa));
  ribs([POD[0][0],9],[POD[1][0],20],lz,3);POD.forEach(([p,z,fa])=>loop(p,z,lz,fa));loop(POD_TOP,28.4,lz,0,0,1);
  if(liftCur>.02){x.setLineDash([3,4]);[[-30,0],[30,0]].forEach(([px,py])=>{const a=pr([px,py,9],0),b=pr([px,py,9],lz);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.strokeStyle='rgba(11,90,117,.35)';x.stroke()});x.setLineDash([])}
  const L=pr([-12,0,28.6],lz),r=4.6*L[3]*sc,lc=liftCur>.3?HEX.off:col;
  if(!RM&&liftCur<.3&&(k==='rec'||k==='att')){const per=k==='rec'?2.4:1.2,ph=(t%per)/per;x.beginPath();x.arc(L[0],L[1],r+ph*18*sc,0,7);x.strokeStyle=`rgba(${lc},${.55*(1-ph)})`;x.lineWidth=1.5;x.stroke()}
  x.beginPath();x.arc(L[0],L[1],r,0,7);x.fillStyle=k==='crit'?'#fff':`rgb(${lc})`;x.fill();x.lineWidth=2;x.strokeStyle=k==='crit'?`rgb(${lc})`:'#fff';x.stroke();
  if(scn){const px=w*(.9-.22*u),py=cy0-2+(RM?0:2*Math.sin(t*1.7)),pw=32,pH=60,rr=(a,b,c2,d2,r2)=>{x.beginPath();x.roundRect?x.roundRect(a,b,c2,d2,r2):x.rect(a,b,c2,d2);x.stroke()};
   x.globalAlpha=.45+.55*u;x.strokeStyle='rgba(11,90,117,.95)';x.lineWidth=1.4;rr(px-pw/2,py-pH/2,pw,pH,7);rr(px-pw/2+3.5,py-pH/2+6,pw-7,pH-15,2);x.beginPath();x.moveTo(px-5,py+pH/2-4.5);x.lineTo(px+5,py+pH/2-4.5);x.stroke();x.globalAlpha=1;
   const ax=L[0]+12,ay=L[1],bx=px-pw/2-7;
   if(u>.97){x.strokeStyle=`rgba(${HEX.rec},.9)`;x.lineWidth=1.6;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,py);x.stroke();const q=RM?.5:(t*1.1)%1;x.beginPath();x.arc(ax+(bx-ax)*q,ay+(py-ay)*q,3.2,0,7);x.fillStyle=`rgb(${HEX.rec})`;x.fill()}
   else{x.setLineDash([2,6]);x.strokeStyle=`rgba(${HEX.crit},.75)`;x.lineWidth=1.4;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,py);x.stroke();x.setLineDash([]);const mx=(ax+bx)/2,my=(ay+py)/2;x.fillStyle='#F3F8FA';x.beginPath();x.arc(mx,my,9,0,7);x.fill();x.strokeStyle=`rgb(${HEX.crit})`;x.lineWidth=1.8;x.beginPath();x.moveTo(mx-4,my-4);x.lineTo(mx+4,my+4);x.moveTo(mx+4,my-4);x.lineTo(mx-4,my+4);x.stroke()}}});
 raf=requestAnimationFrame(frame);}
document.addEventListener('pointerdown',e=>{if(e.target.matches&&e.target.matches('canvas.wire')){drag.on=true;drag.px=e.clientX;drag.py=e.clientY}});
document.addEventListener('pointermove',e=>{if(drag.on){drag.x+=(e.clientX-drag.px)*.012;drag.y=Math.max(-.6,Math.min(.45,drag.y+(e.clientY-drag.py)*.008));drag.px=e.clientX;drag.py=e.clientY}});
document.addEventListener('pointerup',()=>{drag.on=false});
let anim=true;

/* real camera QR scanning on A2 */
let camStream=null,camLoop=0;
function stopCam(){cancelAnimationFrame(camLoop);camLoop=0;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
async function startCam(){const v=document.getElementById('cam'),note=document.getElementById('camnote');if(!v||camStream)return;
 const fail=m=>{if(note)note.textContent=m+' Tap here to simulate a scan.'};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return fail('Camera not available in this viewer.');
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}catch(e){return fail(e&&e.name==='NotAllowedError'?'Camera permission was blocked.':'Camera not available in this viewer.')}
 if(S.cur!=='A2'||!document.getElementById('cam')){stopCam();return}
 v.srcObject=camStream;v.style.display='block';await v.play().catch(()=>{});if(note)note.textContent='Point at the QR code on the kit';
 const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const hit=code=>{S.kit=code||'UB-2291';stopCam();if(navigator.vibrate)navigator.vibrate(60);go('A3')};
 const tick=async()=>{if(!camStream)return;try{if(v.readyState>=2){if(det){const r=await det.detect(v);if(r.length)return hit(r[0].rawValue)}else if(window.jsQR){const w=480,h=Math.round(480*v.videoHeight/v.videoWidth)||360;cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)return hit(r.data)}}}catch(e){}camLoop=requestAnimationFrame(tick)};tick();}
const P=document.getElementById('phone'),G=document.getElementById('guide');
function render(){const s=SC[S.cur];P.className=anim?'enter':'';anim=false;P.innerHTML=s.r()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
 const sim=S.ready?'ready':S.done?'done':S.issue||'ok';
 G.innerHTML=`<button id="gclose" class="gb" data-do="guide">Close guide</button><div><h1>upBeat patient app</h1><div class="sub">Clickable prototype · sample data · tap through the phone</div><div class="sub" style="margin-top:4px;opacity:.8">© 2026 Kiran Poojary · Concept prototype · All rights reserved</div></div>
 <div class="now"><span class="id">${S.cur}</span><div class="nm">${s.n}</div><div class="fl">${s.f}</div><p>${s.why}</p><div class="nav2"><button class="gb" data-do="step:-1">← Previous</button><button class="gb" data-do="step:1">Next →</button></div></div>
 <div><h2>Simulate a state</h2><div class="chips">${[['ok','Recording well'],['signal','Poor signal'],['range','Phone out of range'],['bt','Bluetooth off'],['battery','Battery low'],['done','Day 7 complete'],['ready','Report ready']].map(([v,l])=>`<button class="gb ${sim===v?'on':''}" data-do="sim:${v}">${l}</button>`).join('')}</div></div>
 <div><h2>Jump to a screen</h2>${FLOWS.map(([n,p])=>`<div class="fgrp"><div class="fn">${n}</div><div class="chips">${ORDER.filter(k=>k[0]===p).map(k=>`<button class="gb ${k===S.cur?'on':''}" data-do="jump:${k}" title="${SC[k].n}">${k}</button>`).join('')}</div></div>`).join('')}</div>
 <button class="gb" data-do="restart">Restart from the beginning</button>`;if(!raf)raf=requestAnimationFrame(frame);if(S.cur==='A2'&&!S.manual)startCam();else stopCam();}
document.addEventListener('click',e=>{const d=e.target.closest('[data-do]'),g=e.target.closest('[data-go]');
 if(d){const [f,...r]=d.dataset.do.split(':');const inG=G.contains(d);A[f](r.join(':'));if(inG&&f!=='guide'&&innerWidth<=760&&(f==='jump'||f==='sim'||f==='restart'))G.classList.remove('open');if(!['sym','saveOther','check','fix','sim','jump','step','restart','guide'].includes(f))render();}
 if(g&&(!d||d.contains(g)||g===d))go(g.dataset.go);});
function fit(){const w=document.getElementById('wrap'),st=document.getElementById('stage');if(innerWidth<=760){w.style.cssText='';return}const k=Math.min(1,(innerHeight-56)/844,(st.clientWidth-56)/390);P.style.transform=`scale(${k})`;w.style.width=390*k+'px';w.style.height=844*k+'px';}
document.addEventListener('input',e=>{if(e.target.id==='note'&&S.pend)S.pend.note=e.target.value});addEventListener('resize',fit);fit();render();
</script></body></html>
